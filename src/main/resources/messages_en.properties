# Error messages in English

# General validations
validation.notBlank=This field cannot be empty or contain only spaces.
validation.email.invalid=Email address must be valid and contain an '@'.
validation.email.unique=This email is already in use.
validation.phone.unique=This phone number is already in use.
validation.phone.invalid=Phone number must be a valid Senegalese number (starts with 77, 78, 76, 70 or 75 and contains 9 digits).
validation.cni.invalid=CNI number must contain between 12 and 14 valid digits.
validation.adminCode.invalid=Admin code must be in ADMIN format followed by 4 digits (ex: ADMIN1234).
validation.merchantCode.invalid=Merchant code must be in MARCHAND format followed by 3 digits (ex: MARCHAND123).

# Business errors
user.not.found=User not found with identifier: {0}
user.email.already.used=Email {0} is already used by another user.
user.phone.already.used=Phone number {0} is already used by another user.
user.role.invalid=The specified user role is not valid.
user.creation.failed=Failed to create user.

# Authentication errors
auth.login.failed=Incorrect email or password.
auth.token.invalid=Authentication token is invalid or expired.
auth.token.missing=Authentication token is missing.
auth.access.denied=Access denied. Insufficient permissions.
auth.user.disabled=User account is disabled.

# Account errors
account.not.found=Account not found with identifier: {0}
account.insufficient.balance=Insufficient balance to perform this operation.
account.status.invalid=Account status does not allow this operation.

# Transaction errors
transaction.invalid.amount=Invalid transaction amount.
transaction.failed=Transaction failed.
transaction.not.found=Transaction not found with identifier: {0}

# Success messages
success.user.created=User created successfully.
success.user.retrieved=User retrieved successfully.
success.users.retrieved=Users retrieved successfully.
success.login=Login successful.
success.logout=Logout successful.
success.account.created=Account created successfully.
success.account.updated=Account updated successfully.
success.transaction.created=Transaction created successfully.
success.transaction.processed=Transaction processed successfully.

# General errors
error.internal=An internal error occurred. Please try again later.
error.validation=The provided data is invalid.
error.method.not.allowed=HTTP method not allowed.
error.resource.not.found=Resource not found.
error.bad.request=Malformed request.