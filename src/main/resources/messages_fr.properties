# Messages d'erreur en français

# Validations générales
validation.notBlank=Ce champ ne peut pas être vide ou contenir uniquement des espaces.
validation.email.invalid=L'adresse email doit être valide et contenir un '@'.
validation.email.unique=Cet email est déjà utilisé.
validation.phone.unique=Ce numéro de téléphone est déjà utilisé.
validation.phone.invalid=Le numéro de téléphone doit être un numéro sénégalais valide (commence par 77, 78, 76, 70 ou 75 et comporte 9 chiffres).
validation.cni.invalid=Le numéro de CNI doit comporter entre 12 et 14 chiffres valides.
validation.adminCode.invalid=Le code admin doit être au format ADMIN suivi de 4 chiffres (ex: ADMIN1234).
validation.merchantCode.invalid=Le code marchand doit être au format MARCHAND suivi de 3 chiffres (ex: MARCHAND123).

# Erreurs métier
user.not.found=Utilisateur non trouvé avec l'identifiant: {0}
user.email.already.used=L'email {0} est déjà utilisé par un autre utilisateur.
user.phone.already.used=Le numéro de téléphone {0} est déjà utilisé par un autre utilisateur.
user.role.invalid=Le rôle utilisateur spécifié n'est pas valide.
user.creation.failed=Échec de la création de l'utilisateur.

# Erreurs d'authentification
auth.login.failed=Email ou mot de passe incorrect.
auth.token.invalid=Token d'authentification invalide ou expiré.
auth.token.missing=Token d'authentification manquant.
auth.access.denied=Accès refusé. Permissions insuffisantes.
auth.user.disabled=Le compte utilisateur est désactivé.

# Erreurs de compte
account.not.found=Compte non trouvé avec l'identifiant: {0}
account.insufficient.balance=Solde insuffisant pour effectuer cette opération.
account.status.invalid=Le statut du compte ne permet pas cette opération.

# Erreurs de transaction
transaction.invalid.amount=Montant de transaction invalide.
transaction.failed=Échec de la transaction.
transaction.not.found=Transaction non trouvée avec l'identifiant: {0}

# Messages de succès
success.user.created=Utilisateur créé avec succès.
success.user.retrieved=Utilisateur récupéré avec succès.
success.users.retrieved=Les utilisateurs ont été récupérés avec succès.
success.login=Connexion réussie.
success.logout=Déconnexion réussie.
success.account.created=Compte créé avec succès.
success.account.updated=Compte mis à jour avec succès.
success.transaction.created=Transaction créée avec succès.
success.transaction.processed=Transaction traitée avec succès.

# Erreurs générales
error.internal=Une erreur interne s'est produite. Veuillez réessayer plus tard.
error.validation=Les données fournies sont invalides.
error.method.not.allowed=Méthode HTTP non autorisée.
error.resource.not.found=Ressource non trouvée.
error.bad.request=Requête mal formée.